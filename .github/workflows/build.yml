name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      # Если assets был загружен как zip — распаковываем
      - name: Unzip assets if needed
        shell: pwsh
        run: |
          if (Test-Path assets.zip) { Expand-Archive assets.zip -DestinationPath . -Force }

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name "Презентация" --add-data "assets;assets" start.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-exe
          path: dist/Презентация.exe
